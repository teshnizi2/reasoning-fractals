[project]
name = "reasoning-fractals"
version = "0.1.0"
description = "Fractal basins of a recurrent reasoning model's initial latent thought (EqR on Sudoku)"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: runs model rollouts (needs the EqR checkpoint under data/raw)",
]
